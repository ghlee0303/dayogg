name: Build & Deploy

# production 에 push 되면 이미지 빌드 → ghcr 푸시 → 서버 배포
on:
  push:
    branches: [ production ]
  workflow_dispatch:   # 필요하면 Actions 탭에서 수동 실행

env:
  IMAGE: ghcr.io/ghlee0303/dayogg

jobs:
  # ── 1) 이미지 빌드 후 GitHub Container Registry(ghcr.io) 에 푸시 ──
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # ghcr 에 푸시하려면 필요
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 자동 발급 토큰, 별도 등록 불필요

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest + 커밋 SHA 두 태그로 푸시 (롤백 대비)
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2) 서버에 SSH 접속해 새 이미지 pull 후 재기동 ──
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 서버의 compose 는 레포와 별개 복사본이라 stale 되기 쉬움.
      # 배포 때마다 커밋된 compose 를 서버로 동기화해 항상 최신 설정으로 뜨게 함.
      # (.env 는 서버에만 있는 시크릿이라 건드리지 않음)
      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}   # 미설정 시 기본 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # 디스크 부족(no space left)은 새 이미지 pull 단계에서 터지므로 pull '전에' 정리해 공간 확보.
            # 실행 중 컨테이너가 물고 있는 이미지/볼륨(DB 데이터)은 삭제 대상이 아님 → 데이터 안전.
            docker image prune -af
            docker builder prune -af
            docker container prune -f
            # private 이미지라면 서버도 ghcr 로그인 필요
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f   # 교체돼 미참조가 된 옛 이미지 즉시 회수

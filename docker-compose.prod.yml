services:
  app:
    # build 대신 ghcr 에서 미리 빌드된 이미지를 받아 실행
    image: ghcr.io/ghlee0303/dayogg:latest
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/eternal_return?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
      DB_USERNAME: ${DB_USERNAME:-er_db}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GAME_API_URL: ${GAME_API_URL:-https://open-api.bser.io}
      GAME_API_KEY: ${GAME_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eternal_return
      MYSQL_USER: ${DB_USERNAME:-er_db}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    # 운영: 포트 외부 노출 안 함. app 컨테이너가 내부 네트워크로만 접근
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 운영: 포트 외부 노출 안 함
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:

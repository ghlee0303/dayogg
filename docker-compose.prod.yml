services:
  app:
    # build 대신 ghcr 에서 미리 빌드된 이미지를 받아 실행
    image: ghcr.io/ghlee0303/dayogg:latest
    ports:
      - "8080:8080"
    environment:
      # MySQL 은 RDS 로 분리됨. .env 의 DB_HOST 에 RDS 엔드포인트 입력
      # (예: DB_HOST=my-db.xxxxxx.ap-northeast-2.rds.amazonaws.com)
      DB_URL: jdbc:mysql://${DB_HOST}:3306/eternal_return?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true
      DB_USERNAME: ${DB_USERNAME:-er_db}
      DB_PASSWORD: ${DB_PASSWORD}
      # 운영은 스키마를 건드리지 않음(데이터 보존). 불일치 시 기동 실패로 조용한 손상 방지.
      # 최초 스키마 부트스트랩이 필요하면 .env 에 JPA_DDL_AUTO=update 로 1회만 덮어쓰고 다시 제거.
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      # 배포된 프론트 출처(콤마로 여러 개). .env 의 CORS_ALLOWED_ORIGINS 에 설정
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GAME_API_URL: ${GAME_API_URL:-https://open-api.bser.io}
      GAME_API_KEY: ${GAME_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /dayogg/app
        awslogs-create-group: "true"
        # 기본값이 blocking 이라 전송이 밀리면 앱까지 느려진다. 반드시 끈다.
        # 대가: 버퍼를 넘긴 로그는 조용히 버려진다.
        mode: non-blocking
        max-buffer-size: 4m
        # dual logging(도커 20.10+ 기본)은 읽기용 사본을 로컬 디스크에 또 쌓는다.
        # EC2 디스크가 빠듯해 끈다. 대가로 dayogg logs 에 app 로그가 안 나온다 → CloudWatch 로 조회.
        cache-disabled: "true"

  # Redis 는 EC2 에 그대로 유지 (단일 인스턴스 + 캐시/분산락 용도라 외부화 불필요)
  redis:
    image: redis:7-alpine
    # 운영: 포트 외부 노출 안 함
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # json-file 기본값은 크기 상한이 없어 무한정 쌓인다. 총 30MB 로 묶는다.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  redis-data:

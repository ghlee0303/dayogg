plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'eternal_return'
version = '0.0.1-SNAPSHOT'
description = 'DayoGG_Back — Eternal Return 전적 수집·통계 API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	querydsl {
		extendsFrom compileClasspath
	}
}

repositories {
	mavenCentral()
}

def queryDslVersion = "7.0"
def querydslSrcDir  = layout.buildDirectory.dir("generated/querydsl").get().asFile // build/generated/querydsl

sourceSets {
	main.java.srcDirs += [querydslSrcDir]
}

tasks.withType(JavaCompile).configureEach {
	options.generatedSourceOutputDirectory.set(querydslSrcDir)
}

clean {
	delete file(querydslSrcDir)
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'com.bucket4j:bucket4j-core:8.8.0'
	// .env 파일을 Spring Environment 에 PropertySource 로 등록
	implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Database
	implementation 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Jackson
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Jsoup
	implementation 'org.jsoup:jsoup:1.18.3'

	// Mapstruct
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// Redisson Lock
	implementation("org.redisson:redisson-spring-boot-starter:4.3.0")

	// OpenFeign QueryDSL
	implementation("io.github.openfeign.querydsl:querydsl-core:${queryDslVersion}")
	implementation("io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}")
	annotationProcessor("io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jpa")

}

tasks.named('test') {
	useJUnitPlatform()
}
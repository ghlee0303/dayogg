spring:
  application:
    name: statistics
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/eternal_return?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      # 기본은 로컬/테스트용 create(빈 DB에 스키마 자동 생성).
      # 운영(RDS)은 compose 에서 JPA_DDL_AUTO=validate 로 덮어써 데이터 보존 + 스키마 불일치 시 기동 실패.
      ddl-auto: ${JPA_DDL_AUTO:create}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    mapper:
      accept-case-insensitive-enums: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off

scheduler:
  tier-cut:
    delay-minutes: 10

api:
  base:
    url: ${GAME_API_URL:https://open-api.bser.io}
    key: ${GAME_API_KEY}
  bucket:
    limits: 10

sse:
  timeout-minutes: 5

thread:
  timeout-seconds: 60
  max-permits: 10

path:
  error-log: log/json/

cache:
  timeout-minutes: 30

# CORS 허용 출처(콤마 구분). 기본은 로컬 개발용, 운영은 CORS_ALLOWED_ORIGINS 로 override.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

kind: Application

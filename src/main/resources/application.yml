spring:
  application:
    name: statistics
  main:
    # 배너는 로깅 시스템을 안 거쳐 평문으로 나온다 → "1줄 = 1 JSON 이벤트" 전제가 깨지므로 끈다.
    banner-mode: "off"
    # 기동 3줄("Starting…"·"No active profile set"·"Started … in Xs")은 전부 이 플래그가 낸다.
    # 로거 이름이 StatisticsApplication 이라 root: warn 에 안 걸리므로 여기서 끈다.
    # 재시작 신호는 StartupLogger 가 구조화 1줄로 대신 남긴다.
    log-startup-info: false
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/eternal_return?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&zeroDateTimeBehavior=convertToNull&rewriteBatchedStatements=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  threads:
    virtual:
      enabled: true

  jpa:
    # 기본값 true 는 요청이 끝날 때까지 커넥션을 붙들고, 명시하지 않으면 기동마다 WARN 1줄이 나간다.
    # 응답은 전부 DTO 라 뷰에서 지연 로딩이 필요 없고, SSE 잡은 가상 스레드라 애초에 무관하다.
    open-in-view: false
    hibernate:
      # 기본은 로컬/테스트용 create(빈 DB에 스키마 자동 생성).
      # 운영(RDS)은 compose 에서 JPA_DDL_AUTO=validate 로 덮어써 데이터 보존 + 스키마 불일치 시 기동 실패.
      ddl-auto: ${JPA_DDL_AUTO:create}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    mapper:
      accept-case-insensitive-enums: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  # 로그 1줄 = JSON 이벤트 1개. CloudWatch Logs Insights 가 필드로 파싱한다.
  structured:
    format:
      console: ecs
    # 값이 사실상 상수인 블록은 인코더 단계에서 뺀다 — 수집량이 곧 CloudWatch 비용이다.
    # service.name: 로그 그룹이 이 앱 전용이라 중복 / process.pid: 컨테이너라 항상 동일
    # process.thread.name: 스레드 추적은 code·jobId 축이 대신한다 / ecs.version: "8.11" 고정
    json:
      exclude:
        - service
        - process
        - ecs
  level:
    # 수집량이 곧 CloudWatch 비용이다. 프레임워크 로그는 warn 이상만 내보낸다.
    root: warn
    eternal_return.statistics: info
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
    # 4xx 는 클라이언트가 요청을 잘못 보낸 것이지 서버 장애가 아니다. 405·파라미터 누락·깨진 JSON 마다
    # "Resolved [...]" WARN 을 뿌리는데, 필드가 없어(code·http.uri·client.ip 부재) 질의도 안 된다.
    # 대가: 인자 바인딩 단계에서 깨지는 4xx 는 ControllerLoggingAspect 의 @Around 가 돌기 전이라
    # 이걸 끄면 로그가 아예 안 남는다. 프론트 오류 추적이 필요해지면 이 줄을 지우면 된다.
    # root 는 warn 으로 둔다 — Hikari 스레드 고갈·Redis 재연결 실패 같은 장애 징후는 계속 봐야 한다.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: off

scheduler:
  tier-cut:
    delay-minutes: 10

api:
  base:
    url: ${GAME_API_URL:https://open-api.bser.io}
    key: ${GAME_API_KEY}
  bucket:
    limits: 10

sse:
  timeout-minutes: 5

thread:
  timeout-seconds: 60
  max-permits: 10

cache:
  timeout-minutes: 30

# CORS 허용 출처(콤마 구분). 기본은 로컬 개발용, 운영은 CORS_ALLOWED_ORIGINS 로 override.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

kind: Application

---
# ── 로컬 전용 ────────────────────────────────────────────────────────
# IntelliJ 로 띄우면 stdout 을 수집기가 못 긁으므로, 같은 ECS JSON 을 파일로도 떨군다.
# Alloy 가 이 파일을 tail 해 Loki 로 보내고 Grafana 에서 필드로 펼쳐 본다 (docs/logging.md).
# 운영은 이 프로파일을 안 켜므로 파일이 생기지 않는다 — 컨테이너 디스크를 안 먹는다.
# 켜는 법: IntelliJ Run Configuration 의 Active profiles 에 local
spring:
  config:
    activate:
      on-profile: local

logging:
  structured:
    format:
      # 콘솔(ecs)은 위 기본 문서 그대로 둔다. "1줄 = 1 JSON" 을 IDE 에서 계속 눈으로 검증한다.
      file: ecs
  file:
    name: logs/app.json
